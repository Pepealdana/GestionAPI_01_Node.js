name: One-time history purge

on:
  push:
    branches: ["security/history-purge"]

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install git-filter-repo
        run: python -m pip install git-filter-repo

      - name: Remove sensitive and generated paths from all history
        run: |
          git filter-repo --force \
            --path .env \
            --path compass-connections.json \
            --path node_modules \
            --invert-paths

      - name: Force-push rewritten main history
        run: |
          git push origin HEAD:main --force
          git push origin --tags --force
